name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
    env:
      MONGO_URI: mongodb://127.0.0.1:27017/bioguard_ci
      ADMIN_EMAIL: admin@bioguard.dev
      ALLOW_DEV_CODES: "true"
      JWT_SECRET: ci_secret_value_that_is_long_enough_123456
      NODE_ENV: test
      PORT: "5055"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json
      - run: npm ci --prefix server
      - run: npm ci --prefix client
      - name: Unit tests (fusion, keystroke, mail providers, setup wizard, CORS)
        run: npm test --prefix server
      - name: Build the frontend
        run: npm run build --prefix client
      - name: Admin bootstrap test
        run: npm run test:bootstrap --prefix server
        env:
          MONGO_URI: mongodb://127.0.0.1:27017/bioguard_boot
      - name: API integration tests
        run: |
          npm run seed:demo --prefix server
          node server/src/server.js &
          for i in $(seq 1 30); do curl -sf http://localhost:5055/api/health && break; sleep 1; done
          API=http://localhost:5055/api npm run e2e --prefix server
